  # 빌드 성공 시 도커 이미지 빌드
  docker-image:
    name: Build and Push Docker Image
    # needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      id-token: write # OIDC로 AWS 권한 받을 때 필요

    env:
      AWS_REGION: ${{ vars.AWS_REGION }} # 쓰는 리전으로 변경
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }} # ECR 리포지토리 이름 (미리 만들어둬야 함)
      IMAGE_STEP: ${{ vars.IMAGE_STEP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) GitHub ACCESS KEY and SECRET KEY로 자격증명
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 2) ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3) Docker meta (이미지/태그 생성 규칙)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            # {commit sha}-{step} 규칙
            type=sha,format=short,suffix=-${{ env.IMAGE_STEP }}

      # 4) Build & Push to ECR
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to ECS
    needs:
      # - build
      - docker-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # OIDC로 AWS 권한 받을 때 필요

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
      SERVICE: ${{ vars.ECS_SERVICE_NAME }}
      FAMILY: ${{ vars.ECS_TASK_FAMILY_NAME }}
      DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 현재 태스크정의의 내용 조회 -> taskdef.json 파일에 저장
      - name: Describe current task definition
        id: describe
        run: |
          aws ecs describe-task-definition \
            --task-definition $FAMILY \
            --query 'taskDefinition' > taskdef.json

      # taskdef.json에서 이미지URI를 변경한 new-tastkdef.json 생성 -> new-taskdef.json으로 새로운 태스크정의 개정(Revision) 등록
      - name: Register new task definition revision
        id: register
        run: |
          IMAGE_URI="${{ needs.docker-image.outputs.image_uri }}"
          IMAGE_URI="$(echo "$IMAGE_URI" | head -n 1)"

          # describe 결과에서 register에 필요한 필드만 추출하고 null 필드는 제거
          jq '{
            family: .family,
            taskRoleArn: .taskRoleArn,
            executionRoleArn: .executionRoleArn,
            networkMode: .networkMode,
            containerDefinitions: .containerDefinitions,
            volumes: .volumes,
            placementConstraints: .placementConstraints,
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            tags: .tags,
            pidMode: .pidMode,
            ipcMode: .ipcMode,
            proxyConfiguration: .proxyConfiguration,
            inferenceAccelerators: .inferenceAccelerators,
            ephemeralStorage: .ephemeralStorage,
            runtimePlatform: .runtimePlatform
          } | del(.[] | nulls)' taskdef.json > clean-taskdef.json

          # 이미지 URI 교체
          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image' \
            clean-taskdef.json > new-taskdef.json

          # null 값 완전히 제거 (중첩 필드까지)
          jq 'walk(if type == "object" then with_entries(select(.value != null)) else . end)' \
            new-taskdef.json > final-taskdef.json

          # 새 개정 등록
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://final-taskdef.json \
            --query 'taskDefinition.revision' \
            --output text)

          echo "REVISION=$REVISION" >> $GITHUB_ENV
          echo "✅ Registered new task definition revision: $REVISION"

      # ECS 서비스 업데이트
      - name: Update ECS service
        run: |
          ARGS="--cluster $CLUSTER --service $SERVICE --task-definition ${FAMILY}:${REVISION} --force-new-deployment"
          if [ -n "$DESIRED_COUNT" ]; then
            ARGS="$ARGS --desired-count $DESIRED_COUNT"
          fi
          aws ecs update-service $ARGS

      # ECS 배포 완료 대기 (참고: 20분 내외로 걸리기도 함)
      - name: Wait for ECS service stabilization
        run: |
          TIMEOUT="${STABILIZE_TIMEOUT_SEC:-2400}"         # 기본 40분
          INTERVAL="${STABILIZE_POLL_INTERVAL_SEC:-60}"    # 기본 60초
          DEADLINE=$((SECONDS + TIMEOUT))
          echo "⏳ Waiting up to ${TIMEOUT}s for ECS service '$SERVICE' to stabilize (interval=${INTERVAL}s)..."

          while [ $SECONDS -lt $DEADLINE ]; do
            JSON=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --output json)

            STABLE=$(echo "$JSON" | jq -r '
              .services[0] as $s
              | (($s.deployments | length) == 1)
                and (
                  ($s.deployments[0].rolloutState // "") == "COMPLETED"
                  or (
                    ($s.deployments[0].status // "") == "PRIMARY"
                    and ($s.deployments[0].desiredCount // 0) == ($s.deployments[0].runningCount // -1)
                  )
                )
                and (($s.pendingCount // 0) == 0)
            ')

            if [ "$STABLE" = "true" ]; then
              echo "✅ Service is stable."
              exit 0
            fi

            echo "… still stabilizing. sleeping ${INTERVAL}s"
            sleep "$INTERVAL"
          done

          echo "❌ Timed out waiting for service stabilization after ${TIMEOUT}s"
          exit 1

