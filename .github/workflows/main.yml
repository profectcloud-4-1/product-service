  # 이미지 빌드 실패 시
  notify-slack-on-image-build-failure:
    name: Notify Slack on image build failure
    needs:
      - docker-image
    runs-on: ubuntu-latest
    if: ${{ always() && needs.docker-image.result == 'failure' }}
    steps:
      - name: Send Slack message on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        run: |
          REPO="${GITHUB_REPOSITORY}"
          BRANCH_FROM="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"   # PR일 경우: from 브랜치
          BRANCH_TO="${GITHUB_BASE_REF:-main}"                   # PR일 경우: target 브랜치
          RUN_ID="${GITHUB_RUN_ID}"
          GH_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          MESSAGE="❌ *Image Build/Push Failed*

          *Repository* : \`${REPO}\`
          *Branch* : \`${BRANCH_FROM}\` → \`${BRANCH_TO}\`

          *GitHub Run*: <${GH_URL}|View in GitHub>"

          payload=$(jq -n --arg text "$MESSAGE" '{ text: $text }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

  # Slack 알림: 배포 실패 시
  notify-slack-on-deploy-failure:
    name: Notify Slack on deploy failure
    needs:
      - deploy
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'failure' }} # 실패했을 때만 실행
    steps:
      - name: Send Slack message on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          GH_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MESSAGE="😱 *FAILED - \`${{ vars.ECS_SERVICE_NAME }}\`*
          $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
          <${GH_URL}|View in GitHub Run>
          "

          payload=$(jq -n \
            --arg text "$MESSAGE" \
            --arg color "danger" \
            '{ attachments: [ { color: $color, mrkdwn_in: ["text"], text: $text } ] }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

  # Slack 알림: 정상적으로 배포 완료 시
  notify-slack-on-deploy-success:
    name: Notify Slack on deploy success
    needs:
      - deploy
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'success' }} # 성공했을 때만 실행
    steps:
      - name: Send Slack message on success
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

        run: |
          MESSAGE="🥳 *SUCCESS - \`${{ vars.ECS_SERVICE_NAME }}\`*
          $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
          "

          payload=$(jq -n \
            --arg text "$MESSAGE" \
            --arg color "good" \
            '{ attachments: [ { color: $color, mrkdwn_in: ["text"], text: $text } ] }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
