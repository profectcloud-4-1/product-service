spring:
  application:
    name: "product-service"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1 # 이 부분 메시지 보장 전략에 따라 수정
      retries: 3
      properties:
        enable.idempotence: true # 이 부분 메시지 보장 전략에 따라 수정
        #MSK 보안 설정
        # security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
        # sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
        # sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
        # ssl.endpoint.identification.algorithm: https
    consumer:
      # group-id: stock-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
      timeout: ${REDIS_COMMAND_TIMEOUT} # redis-server 호출 했을 때 대기 시간
      connect-timeout: ${REDIS_CONNECT_TIMEOUT} # redis-server 연결시 대기 시간

springdoc:
  use-fqn: true

server:
  port: ${SERVER_PORT}

service:
  product:
    url: ${PRODUCT_SERVICE_URL}
  order:
    url: ${ORDER_SERVICE_URL}
  payment:
    url: ${PAYMENT_SERVICE_URL}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    region: ${AWS_S3_REGION}
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}
    default-image: ${AWS_DEFAULT_IMAGE}

stock:
  adjust:
    retry:
      base-off-ms: ${BASE_OFF_MS}
      max-retries: ${MAX_RETRIES}

  resilience4j:
    ratelimiter:
      instances:
        productOrigin:
          limitForPeriod: ${PRODUCT_ORIGIN_LIMIT_FOR_PERIOD}
          limitRefreshPeriod: ${PRODUCT_ORIGIN_LIMIT_REFRESH_PERIOD}
          timeoutDuration: ${PRODUCT_ORIGIN_TIMEOUT_DURATION}

  bulkhead:
    instances:
      productOrigin:
        maxConcurrentCalls: ${PRODUCT_ORIGIN_MAX_CONCURRENT_CALLS}
        maxWaitDuration: ${PRODUCT_ORIGIN_MAX_WAIT_DURATION}
