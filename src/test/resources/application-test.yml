spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true           # 필요 없으면 빼도 됨

  sql:
    init:
      mode: never             # 굳이 data.sql, schema.sql 안쓰면 never로 둬도 됨

  data:
    redis:
      host: localhost
      port: 7000
      password:
      database: 1
      timeout: 200ms
      connect-timeout: 200ms

  aws:
    s3:
      access-key: dummy
      secret-key: dummy
      region: ap-northeast-2
      bucket: dummy-bucket
    cloudfront:
      domain: https://dummy.cloudfront.net

server:
  port: 8080

service:
  product:
    url: http://localhost:8081
  order:
    url: http://localhost:8082
  payment:
    url: http://localhost:8083


stock:
  adjust:
    retry:
      base-off-ms: 20
      max-retries: 3

resilience4j:
  ratelimiter:
    instances:
      productOrigin:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0

  bulkhead:
    instances:
      productOrigin:
        maxConcurrentCalls: 1
        maxWaitDuration: 0

# Kafka 설정은 @EmbeddedKafka 어노테이션으로 자동 설정됨
# 테스트 환경에서는 EmbeddedKafka 브로커가 자동으로 시작됨
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: test-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"